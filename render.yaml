# One-click setup on Render.com (Blueprint). Fill the secret values in the Render dashboard.
services:
  - type: web
    name: smart-shop
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 3 --preload --timeout 60 -b 0.0.0.0:$PORT app:app
    disk:
      name: shop-files
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase: {name: smart-shop-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_KEY
        generateValue: true
      - {key: APP_NAME, value: Smart Shop Manager}
      - {key: BASE_URL, sync: false}
      - {key: SUPERADMIN_EMAIL, sync: false}
      - {key: SUPERADMIN_PASSWORD, sync: false}
      - {key: PAYSTACK_SECRET_KEY, sync: false}
      - {key: VAPID_PUBLIC_KEY, sync: false}
      - {key: VAPID_PRIVATE_KEY, sync: false}
      - {key: VAPID_EMAIL, value: "mailto:you@yourdomain.com"}
databases:
  - name: smart-shop-db
    plan: basic-256mb
    region: frankfurt
